name: Release

# Genera instaladores (NSIS / DMG) y los sube a GitHub Releases al publicar un tag v*.
#
# Ejemplo:
#   git tag v0.3.0
#   git push origin v0.3.0

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag a publicar (ej. v0.3.0). Debe existir en el repo."
        required: true
        default: "v0.3.0"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundle_targets: nsis
            bundle_glob: |
              target/release/bundle/nsis/*-setup.exe
          - os: macos-latest
            bundle_targets: app,dmg
            bundle_glob: |
              target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: dtolnay/rust-toolchain@stable

      - uses: KyleMayes/install-llvm-action@v2
        with:
          version: "18"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install frontend deps
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Build instaladores
        working-directory: apps/desktop
        run: pnpm tauri build --bundles ${{ matrix.bundle_targets }}

      - name: Upload a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: ${{ matrix.bundle_glob }}
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
