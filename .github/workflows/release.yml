name: Release

# Genera instaladores (NSIS / DMG) y los sube a GitHub Releases.
#
# Los tags v* YA NO disparan este workflow. Windows + macOS agotan el cupo
# de Actions; publicar un tag no debe gastar minutos.
#
# Para generar instaladores en CI, disparalo a mano:
#   Actions → Release → Run workflow → tag (ej. v0.4.4; debe existir).
# En local (Windows):
#   cd apps/desktop && pnpm tauri build --bundles nsis
#   gh release create v0.4.4 target/release/bundle/nsis/Atic_*_x64-setup.exe

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag a publicar (ej. v0.4.4). Debe existir en el repo."
        required: true
        default: "v0.4.4"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundle_targets: nsis
            bundle_glob: |
              target/release/bundle/nsis/*-setup.exe
          - os: macos-latest
            bundle_targets: app,dmg
            bundle_glob: |
              target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: dtolnay/rust-toolchain@stable

      - uses: KyleMayes/install-llvm-action@v2
        with:
          version: "18"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install frontend deps
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Build instaladores
        working-directory: apps/desktop
        run: pnpm tauri build --bundles ${{ matrix.bundle_targets }}

      - name: Upload a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: ${{ matrix.bundle_glob }}
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
