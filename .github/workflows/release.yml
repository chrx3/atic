name: Release

# Genera instaladores (NSIS / DMG) y los sube a GitHub Releases.
#
# Los tags v* YA NO disparan este workflow. Windows + macOS agotan el cupo
# de Actions; publicar un tag no debe gastar minutos.
#
# Para generar instaladores en CI, disparalo a mano:
#   Actions → Release → Run workflow → tag (ej. v0.4.9; debe existir).
# El camino normal (sin gastar minutos de Actions) es local:
#   powershell -File scripts/release-windows.ps1
#   powershell -File scripts/release-windows.ps1 -Publish
#
# En local, a mano:
#   cd apps/desktop && pnpm tauri build --bundles nsis
#   gh release create v0.4.9 --latest --
#     target/release/bundle/nsis/Atic_*_x64-setup.exe
#     target/release/bundle/nsis/Atic_*_x64-setup.exe.sig
#     target/release/bundle/nsis/latest.json
#
# El auto-updater lee latest.json del release marcado como Latest.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag a publicar (ej. v0.4.6). Debe existir en el repo."
        required: true
        default: "v0.4.9"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundle_targets: nsis
            bundle_glob: |
              target/release/bundle/nsis/*-setup.exe
              target/release/bundle/nsis/*-setup.exe.sig
              target/release/bundle/nsis/latest.json
          - os: macos-latest
            bundle_targets: app,dmg
            bundle_glob: |
              target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: dtolnay/rust-toolchain@stable

      - uses: KyleMayes/install-llvm-action@v2
        with:
          version: "18"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install frontend deps
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Build instaladores
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles ${{ matrix.bundle_targets }}

      - name: Write latest.json (Windows updater)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          $tag = $env:RELEASE_TAG
          if (-not $tag) { throw "Falta el tag del release." }
          $ver = $tag.TrimStart('v')
          $dir = "target/release/bundle/nsis"
          $exe = Get-ChildItem -Path $dir -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $exe) { throw "No encontré el instalador NSIS." }
          $sigPath = "$($exe.FullName).sig"
          if (-not (Test-Path $sigPath)) { throw "No encontré $($exe.Name).sig. ¿TAURI_SIGNING_PRIVATE_KEY está en los secrets?" }
          $sig = (Get-Content -Raw -Path $sigPath).Trim()
          $url = "https://github.com/chrx3/atic/releases/download/$tag/$($exe.Name)"
          $manifest = [ordered]@{
            version = $ver
            notes = "Atic $tag"
            pub_date = [DateTime]::UtcNow.ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $sig
                url = $url
              }
            }
          }
          $out = Join-Path ((Resolve-Path $dir).Path) "latest.json"
          [System.IO.File]::WriteAllText($out, ($manifest | ConvertTo-Json -Depth 6))
          Write-Host "Wrote $out -> $url"

      - name: Upload a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: ${{ matrix.bundle_glob }}
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
