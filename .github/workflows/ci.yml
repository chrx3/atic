name: CI

# whisper-rs compila whisper.cpp: requiere CMake (preinstalado en los runners
# de GitHub) y LLVM/libclang (lo instalamos con la acción de abajo).
#
# Cupo: macOS se factura ×10 y Windows ×2. El matrix Win+Mac en cada PR
# (incluido Dependabot) agotó los 2.000 min/mes. Por eso:
#   - PRs: frontend + rustfmt (baratos, Linux ×1).
#   - Push a main: clippy+test en Windows.
#   - Build de la app: solo push a main, Windows.
#   - macOS: solo el workflow Release (instaladores).

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Install
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile
      # check + lint + stylelint + prettier + vitest
      - name: Verify
        working-directory: apps/desktop
        run: pnpm verify

  rustfmt:
    name: rustfmt
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: fmt
        run: cargo fmt --all --check

  rust:
    name: Rust (windows)
    if: github.event_name == 'push' && github.actor != 'dependabot[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: KyleMayes/install-llvm-action@v2
        with:
          version: "18"
      - uses: Swatinem/rust-cache@v2
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace

  build:
    name: Build app (windows)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'dependabot[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: dtolnay/rust-toolchain@stable
      - uses: KyleMayes/install-llvm-action@v2
        with:
          version: "18"
      - uses: Swatinem/rust-cache@v2
      - name: Install frontend deps
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile
      - name: Build (sin firmar)
        working-directory: apps/desktop
        run: pnpm tauri build --no-bundle
