name: CI

# Repo público: los runners estándar no consumen minutos, así que `pill`
# corre en cada push a `main` y en cada PR: compila y prueba la app (la pill
# GPUI) en Windows. El resto va a mano desde Actions → CI → Run workflow:
# `frontend`, `rust` y `build` son de la versión Tauri (legado, para Mac) y
# `rustfmt` está en rojo porque el código aún no pasa por rustfmt.
# Instaladores: solo en local (`scripts/release-windows.ps1`). No hay job de
# release en GitHub.

on:
  workflow_dispatch:
    inputs:
      windows:
        description: "Correr clippy/test y build en Windows (lento)"
        type: boolean
        default: false
  # Un push que solo toca docs (u otra cosa que la pill no lee) no la compila:
  # son ~6 minutos de Windows para nada. La lista es lo que entra al build:
  # la pill, los crates, y de `apps/desktop` lo que lee su `build.rs` y sus
  # `include_*!` (versión, ícono, emojis).
  push:
    branches: [main]
    paths: &pill-paths
      - "prototypes/pill-gpui/**"
      - "crates/**"
      - "apps/desktop/src/**"
      - "apps/desktop/src-tauri/**"
      - ".cargo/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths: *pill-paths

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pill:
    name: Pill GPUI (windows)
    runs-on: windows-latest
    env:
      # rust-cache solo guarda los crates de crates.io: los de ruta (gpui de
      # `vendor/`, gpui-m3 y los `atic-*`) se compilaban enteros en cada
      # corrida, con opt-level 3. sccache los guarda por el hash de su
      # contenido en la caché de Actions, así que solo se recompila el que
      # cambió. La pill misma (un binario) no entra en sccache.
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      # Los tests no necesitan depurador: sin debuginfo, la pill (~120 mil
      # líneas en un crate) compila y enlaza más rápido.
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      # La pill usa gpui-m3 por ruta relativa (`../../../gpui-m3`): los dos
      # repos van lado a lado, como en local.
      - uses: actions/checkout@v4
        with:
          path: atic
      - uses: actions/checkout@v4
        with:
          repository: chrx3/gpui-m3
          path: gpui-m3
      - uses: dtolnay/rust-toolchain@stable
      - uses: KyleMayes/install-llvm-action@v2
        with:
          version: "18"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: atic/prototypes/pill-gpui -> target
      - uses: mozilla-actions/sccache-action@v0.0.9
      - name: test
        working-directory: atic/prototypes/pill-gpui
        run: cargo test --locked
      - name: sccache stats
        if: always()
        run: sccache --show-stats

  frontend:
    name: Frontend (Tauri)
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Install
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile
      # check + lint + stylelint + prettier + vitest
      - name: Verify
        working-directory: apps/desktop
        run: pnpm verify

  rustfmt:
    name: rustfmt
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: fmt
        run: cargo fmt --all --check

  rust:
    name: Rust (windows)
    if: ${{ inputs.windows }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: KyleMayes/install-llvm-action@v2
        with:
          version: "18"
      - uses: Swatinem/rust-cache@v2
      - name: Sidecar MCP (lo exige tauri-build al compilar)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-mcp.ps1
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace

  build:
    name: Build app (windows)
    if: ${{ inputs.windows }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: dtolnay/rust-toolchain@stable
      - uses: KyleMayes/install-llvm-action@v2
        with:
          version: "18"
      - uses: Swatinem/rust-cache@v2
      - name: Install frontend deps
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile
      - name: Sidecar MCP (lo exige tauri-build al compilar)
        working-directory: apps/desktop
        run: pnpm mcp:build
      - name: Build (sin firmar)
        working-directory: apps/desktop
        run: pnpm tauri build --no-bundle
