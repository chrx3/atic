name: CI

# Repo público: los runners estándar no consumen minutos, así que `frontend` y
# `rustfmt` corren en cada push a `main` y en cada PR (feedback rápido).
# Los jobs pesados (`rust` en Windows, `build`) siguen a mano desde Actions →
# CI → Run workflow: tardan bastante más que correrlos en local.
# Instaladores: solo en local (`scripts/release-windows.ps1`). No hay job de
# release en GitHub.

on:
  workflow_dispatch:
    inputs:
      windows:
        description: "Correr clippy/test y build en Windows (lento)"
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Install
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile
      # check + lint + stylelint + prettier + vitest
      - name: Verify
        working-directory: apps/desktop
        run: pnpm verify

  rustfmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: fmt
        run: cargo fmt --all --check

  rust:
    name: Rust (windows)
    if: ${{ inputs.windows }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: KyleMayes/install-llvm-action@v2
        with:
          version: "18"
      - uses: Swatinem/rust-cache@v2
      - name: Sidecar MCP (lo exige tauri-build al compilar)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-mcp.ps1
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace

  build:
    name: Build app (windows)
    if: ${{ inputs.windows }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: dtolnay/rust-toolchain@stable
      - uses: KyleMayes/install-llvm-action@v2
        with:
          version: "18"
      - uses: Swatinem/rust-cache@v2
      - name: Install frontend deps
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile
      - name: Sidecar MCP (lo exige tauri-build al compilar)
        working-directory: apps/desktop
        run: pnpm mcp:build
      - name: Build (sin firmar)
        working-directory: apps/desktop
        run: pnpm tauri build --no-bundle
