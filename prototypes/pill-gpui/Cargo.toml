[package]
name = "pill-gpui"
version = "0.1.0"
edition = "2021"
publish = false

# Prototipo aislado: fuera del workspace de Atic para no tocar su Cargo.lock
# ni compartir target/ con `tauri dev`.
[workspace]

[dependencies]
gpui = "0.2.2"
anyhow = "1"
raw-window-handle = "0.6"
unicode-segmentation = "1"

[target.'cfg(windows)'.dependencies]
# Mismas versiones que `apps/desktop/src-tauri`, de donde viene `drag.rs`.
windows-core = "0.61"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.dev]
opt-level = 1
incremental = false

[profile.dev.package."*"]
opt-level = 3
debug = 0
