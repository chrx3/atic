[package]
name = "pill-gpui"
version = "0.1.0"
edition = "2021"
publish = false

# Prototipo aislado: fuera del workspace de Atic para no tocar su Cargo.lock
# ni compartir target/ con `tauri dev`.
[workspace]

[dependencies]
gpui = "0.2.2"
anyhow = "1"
raw-window-handle = "0.6"
unicode-segmentation = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# La misma que ya trae gpui: para armar el ícono de la app de origen.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Mismas versiones que `apps/desktop/src-tauri`, de donde viene `flip_export.rs`.
zip = { version = "4.6.1", default-features = false, features = ["deflate"] }
base64 = "0.22"
# Las firmas de las actualizaciones (`updater.rs`): la misma que usa Tauri.
minisign-verify = "0.2.5"
# El motor de capturas de Atic: monitores, congelar, ventanas, recortar y PNG.
atic-capture = { path = "../../crates/capture" }
# El historial del portapapeles: la pill es su dueña con `native_pill`.
atic-clipboard = { path = "../../crates/clipboard" }
# La calculadora del lanzador y las tasas de cambio.
atic-calc = { path = "../../crates/calc" }
# Hooks de las consolas de agentes y cómo contestar sus permisos.
atic-agents = { path = "../../crates/agents" }
# El canal con la app del celular (`phone.rs`) y su QR.
atic-sync = { path = "../../crates/sync" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
qrcode = { version = "0.14", default-features = false, features = ["image"] }
# El dictado de Atic sin Tauri: configuración y llavero, micrófono (con
# RNNoise) y transcripción por Groq. Sin el Whisper local (feature `local`).
atic-core = { path = "../../crates/core", features = ["diagnostics"] }
atic-audio = { path = "../../crates/audio" }
atic-transcribe = { path = "../../crates/transcribe" }
# Reuniones: resumir con el proveedor de Atic y mandar el resumen por correo.
atic-summarize = { path = "../../crates/summarize" }
atic-mailer = { path = "../../crates/mailer" }
# La misma que trae `atic-audio`: el aviso audible al grabar (`meetings/chime.rs`).
cpal = "0.15"
# La misma que trae `atic-audio`: leer las pistas WAV en el reproductor de Reuniones.
hound = "3.5"
# La misma que trae `atic-transcribe`: solo para encenderle ogg/vorbis y flac,
# así «Importar audio» de Reuniones (`meetings/import.rs`) también los lee.
symphonia = { version = "0.6", default-features = false, features = ["ogg", "vorbis", "flac"] }
# La misma que trae `atic-transcribe`: la llamada a Groq con `prompt`.
reqwest = { version = "0.12", features = ["blocking", "multipart", "json"] }
# Ya viene con los crates de Atic: los avisos de los lectores de uso.
tracing = "0.1"
log = "0.4"
# La misma que trae `atic-core`: los lectores de uso de Cursor y OpenCode (`quota/`).
rusqlite = { version = "0.32", features = ["bundled"] }
# Ya vienen con gpui: puntas redondas en pantalla y la composición del PNG.
lyon = "1.0"
# El motor de terminal de Alacritty (Apache-2.0): parser VT, grilla, scrollback
# y ConPTY en Windows. Es lo que usa Zed por dentro.
alacritty_terminal = "0.26"
# Ya viene con gpui: el canal de avisos del PTY.
futures = "0.3"
# El Vector2 de Windows.UI.Composition (ya viene con `windows`).
windows-numerics = "0.2"
tiny-skia = "0.11"
# Los componentes de Material 3 Expressive de Atic Code (`code/`), solo para
# ese estilo. Misma gpui 0.2.2; pasará a git cuando esté publicada.
gpui-m3 = { path = "../../../gpui-m3" }
# El índice de archivos de Atic Code respetando `.gitignore` (el mismo de
# la referencia); sus dependencias ya estaban en el lock.
ignore = "0.4.23"

[build-dependencies]
# El ícono del exe (`build.rs`); la misma versión que usa Tauri.
tauri-winres = "0.3.6"

[target.'cfg(windows)'.dependencies]
# Mismas versiones que `apps/desktop/src-tauri`, de donde viene `drag.rs`.
windows-core = "0.61"
# Ya viene con `windows`: esperar las operaciones de WinRT con límite de tiempo.
windows-future = "0.2"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    # `quota/`: el PATH del registro y la credencial de Antigravity.
    "Win32_System_Registry",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows = { version = "0.61", features = [
    "Win32_Devices_FunctionDiscovery",
    "Win32_System_Registry",
    "Media_Control",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_SystemInformation",
    "Win32_System_ProcessStatus",
    "Win32_Devices_Display",
    "Win32_System_Rpc",
    "Win32_System_Variant",
    "Win32_System_Wmi",
    "Win32_Media_Audio_Endpoints",
    "Win32_Media_Audio",
    "Foundation",
    "System",
    "UI_Composition",
    "UI_Composition_Desktop",
    "UI_ViewManagement",
    "Win32_System_WinRT_Composition",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
    "Win32_System_WinRT",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_Shutdown",
    "Win32_Storage_EnhancedStorage",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    # Grabar la pantalla (`screen_record.rs`): la captura de Windows y Media Foundation.
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Media_MediaFoundation",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
] }

[profile.dev]
opt-level = 1
incremental = false

[profile.dev.package."*"]
opt-level = 3
debug = 0

# Lo que va en el instalador: más lento de compilar, más rápido de correr y
# más chico. Sin `panic = "abort"`: un hilo que entra en pánico hoy muere
# solo, y con abort se llevaría la pill entera.
[profile.release]
lto = "fat"
codegen-units = 1
