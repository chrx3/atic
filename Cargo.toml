[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/audio",
    "crates/capture",
    "crates/transcribe",
    "crates/summarize",
    "crates/mailer",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.4.4"
edition = "2021"
license = "MIT"
authors = ["chrx3"]
repository = "https://github.com/chrx3/atic"

[workspace.dependencies]
# Crates internos
atic-core = { path = "crates/core" }
atic-audio = { path = "crates/audio" }
atic-capture = { path = "crates/capture" }
atic-transcribe = { path = "crates/transcribe" }
atic-summarize = { path = "crates/summarize" }
atic-mailer = { path = "crates/mailer" }

# Compartidas
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", features = ["serde", "clock"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

[profile.dev]
# La captura de audio y whisper son sensibles al rendimiento incluso en debug.
opt-level = 1
# Optimizado + incremental corrompe los artefactos en Windows/MSVC: el enlazado
# falla con `unresolved external symbol anon.*.llvm.*` apuntando a crates que ni
# se tocaron (zip, bytes, http_body_util…), y la única salida es borrar
# `target/debug/incremental` a mano — 5 GB, y volvió a pasar dos veces en una
# sola sesión. Con el perfil ya optimizado, incremental aporta poco reuso y a
# cambio rompe el ciclo de desarrollo cada tantas recompilaciones.
incremental = false

[profile.dev.package."*"]
opt-level = 3
