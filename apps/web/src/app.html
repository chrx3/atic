<!doctype html>
<html lang="es" data-theme="dark" data-theme-base="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" />
    <script>
      // El tema antes del primer pintado: sin esto, un localStorage claro
      // destella oscuro.
      try {
        var t = JSON.parse(localStorage.getItem("atic-web-theme") || '"dark"');
        var dark = ["dark", "graphite", "midnight", "claude-dark"].indexOf(t) >= 0;
        document.documentElement.dataset.theme = t;
        document.documentElement.dataset.themeBase = dark ? "dark" : "light";
      } catch (e) {}
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
