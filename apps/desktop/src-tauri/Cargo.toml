[package]
name = "atic-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Atic — grabación, transcripción y resumen de llamadas"
authors = ["CIAT"]

[lib]
# El sufijo _lib evita conflicto de nombre con el binario en Windows.
name = "atic_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-drag = "2"
tauri-plugin-notification = "2"

serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

atic-core = { workspace = true }
atic-audio = { workspace = true }
atic-capture = { workspace = true }
atic-transcribe = { workspace = true }
atic-summarize = { workspace = true }
atic-mailer = { workspace = true }

cpal = "0.15"
arboard = "3"
image = { version = "0.25", default-features = false, features = ["png"] }
uuid = { version = "1", features = ["v4"] }
zip = { version = "4.6.1", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }
# Misma versión que trae Tauri/wry (desactivar Ctrl+P / atajos del navegador).
webview2-com = "0.38"
windows-core = "0.61"
windows = { version = "0.61", features = [
  "Foundation",
  "Globalization",
  "Graphics_Imaging",
  "Media_Ocr",
  "Storage",
  "Storage_Streams",
] }

[features]
default = []
# Aceleración GPU opcional para Whisper (atic-transcribe). Default = CPU.
# Invocar: pnpm tauri build -- --features gpu-metal|gpu-cuda|gpu-vulkan
gpu-metal = ["atic-transcribe/metal"]
gpu-cuda = ["atic-transcribe/cuda"]
gpu-vulkan = ["atic-transcribe/vulkan"]
