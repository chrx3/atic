[package]
name = "atic-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Atic — grabación, transcripción y resumen de llamadas"
authors = ["chrx3"]

[lib]
# El sufijo _lib evita conflicto de nombre con el binario en Windows.
name = "atic_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset", "devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-drag = "2"
tauri-plugin-notification = "2"

serde = { workspace = true }
serde_json = { workspace = true }
# ACP: OpenCode y Cursor lo hablan nativo, así que un adaptador sirve para los
# dos. No arrastra tokio — va con `futures` + `async-io`, que traen su reactor.
agent-client-protocol = "2"
futures = "0.3"
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }

atic-core = { workspace = true }
atic-audio = { workspace = true }
atic-capture = { workspace = true }
atic-transcribe = { workspace = true }
atic-summarize = { workspace = true }
atic-mailer = { workspace = true }

cpal = "0.15"
arboard = "3"
image = { version = "0.25", default-features = false, features = ["png"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
zip = { version = "4.6.1", default-features = false, features = ["deflate"] }
# Mismo cliente HTTP que summarize/transcribe: cupos OAuth de Claude Code.
reqwest = { version = "0.12", features = ["blocking", "json"] }
portable-pty = "0.9"
rusqlite = { version = "0.32", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_System_Diagnostics_ToolHelp",
    # Formatos del portapapeles: saber si lo copiado pide no ser archivado.
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    # Init de COM en el hilo bloqueante que extrae iconos del launcher.
    "Win32_System_Com",
    # PATH fresco del registro para resolver CLIs recién instalados.
    "Win32_System_Registry",
    # Leer la credencial de Antigravity (agy) del Credential Manager.
    "Win32_Security_Credentials",
] }
# Misma versión que trae Tauri/wry (desactivar Ctrl+P / atajos del navegador).
webview2-com = "0.38"
windows-core = "0.61"
windows = { version = "0.61", features = [
  "Foundation",
  "Globalization",
  "Graphics_Imaging",
  "Media_Ocr",
  "Storage",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_SystemServices",
  # Enumerar shell:AppsFolder (apps UWP/Store del launcher) y sus iconos.
  "Win32_UI_Shell",
  # PKEY_AppUserModel_ID, para identificar cada app del AppsFolder.
  "Win32_Storage_EnhancedStorage",
] }

[features]
default = []
# Aceleración GPU opcional para Whisper (atic-transcribe). Default = CPU.
# Invocar: pnpm tauri build -- --features gpu-metal|gpu-cuda|gpu-vulkan
gpu-metal = ["atic-transcribe/metal"]
gpu-cuda = ["atic-transcribe/cuda"]
gpu-vulkan = ["atic-transcribe/vulkan"]
