# Alias de cargo para el workspace de la raíz (los crates compartidos).
#
# La app (`apps/atic`) tiene su propio workspace: sus comandos llevan
# `--manifest-path apps/atic/Cargo.toml` (ver AGENTS.md).
[alias]
# Todo el workspace, sin linkear.
ckw = "check --workspace --all-targets"

# Enlazado en Windows con el lld que viene en el toolchain: bastante más rápido
# que link.exe en un binario de este tamaño. No afecta a macOS.
[target.x86_64-pc-windows-msvc]
linker = "rust-lld"
