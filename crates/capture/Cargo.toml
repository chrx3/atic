[package]
name = "atic-capture"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
chrono = { workspace = true }
thiserror.workspace = true
tracing.workspace = true
# PNG para la captura final; JPEG para la mira (encodear un dual 4K a PNG
# se come cientos de ms y el overlay no necesita lossless).
png = "0.17"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
# La pantalla del celular en el PC (`h264`): el decodificador de Cisco, solo para
# quien lo pide (la pill). Va aquí y no en la pill para que en desarrollo también
# corra optimizado: la pill se compila sin optimizar y pasar a BGRA tardaba 46 ms.
openh264 = { version = "0.9", optional = true }
# Cambiar el bitrate sin rehacer el codificador (`SetOption`, que el crate no expone).
openh264-sys2 = { version = "0.9", optional = true }

[features]
h264 = ["dep:openh264", "dep:openh264-sys2"]

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.24"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Storage_Xps",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_System_Threading",
] }
