[package]
name = "atic-capture"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
chrono = { workspace = true }
thiserror.workspace = true
tracing.workspace = true
# PNG para la captura final; JPEG para la mira (encodear un dual 4K a PNG
# se come cientos de ms y el overlay no necesita lossless).
png = "0.17"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
# La pantalla del celular en el PC (`h264`): el decodificador de Cisco, solo para
# quien lo pide (la pill). Va aquí y no en la pill para que en desarrollo también
# corra optimizado: la pill se compila sin optimizar y pasar a BGRA tardaba 46 ms.
openh264 = { version = "0.9", optional = true }
# Cambiar el bitrate sin rehacer el codificador (`SetOption`, que el crate no expone).
openh264-sys2 = { version = "0.9", optional = true }

[features]
h264 = [
    "dep:openh264",
    "dep:openh264-sys2",
    "dep:block2",
    "dep:dispatch2",
    "dep:objc2",
    "dep:objc2-core-media",
    "dep:objc2-foundation",
    "dep:objc2-screen-capture-kit",
    "dep:windows",
    "dep:core-video",
]

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.24"
# La pantalla en vivo (`stream`): ScreenCaptureKit y VideoToolbox, solo con `h264`.
# `core-video` en la versión de GPUI: el cuadro decodificado va directo a `gpui::surface`.
core-video = { version = "0.4", optional = true }
block2 = { version = "0.6", optional = true }
dispatch2 = { version = "0.3", optional = true }
objc2 = { version = "0.6", optional = true }
objc2-core-media = { version = "0.3", optional = true, default-features = false, features = ["CMSampleBuffer", "CMTime", "objc2"] }
objc2-foundation = { version = "0.3", optional = true, default-features = false, features = ["NSArray", "NSError", "NSObject", "NSString"] }
objc2-screen-capture-kit = { version = "0.3", optional = true, default-features = false, features = [
  "std",
  "SCStream",
  "SCShareableContent",
  "block2",
  "dispatch2",
  "objc2-core-graphics",
  "objc2-core-media",
] }

[target.'cfg(windows)'.dependencies]
# El monitor en vivo con DXGI (`engine::dxgi`), solo con `h264`. La misma versión que
# usa `atic-audio`.
windows = { version = "0.61.3", optional = true, features = [
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Storage_Xps",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_System_Threading",
] }
