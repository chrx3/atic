[package]
name = "atic-sync"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Canal cifrado entre Atic de escritorio y el celular (iroh)."

[features]
# Deriva los tipos para UniFFI; lo activa solo `atic-sync-ffi` (Android).
uniffi = ["dep:uniffi"]

[dependencies]
iroh = "1.3"
# Encontrar al otro en la misma red sin pasar por internet (mDNS).
iroh-mdns-address-lookup = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
base64 = "0.22"
# BBR para la conexión de video (`video::connect`); la misma versión que usa iroh.
noq-proto = { version = "1.3", default-features = false }
getrandom = "0.3"
uniffi = { version = "0.32", optional = true }

[dev-dependencies]
# El proxy UDP de la red mala simulada (`video_red_mala.rs`).
tokio = { version = "1", features = ["net"] }
qrcode = { version = "0.14", default-features = false }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

