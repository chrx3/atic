[package]
name = "atic-sync"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Canal cifrado entre Atic de escritorio y el celular (iroh)."

[features]
# Deriva los tipos para UniFFI; lo activa solo `atic-sync-ffi` (Android).
uniffi = ["dep:uniffi"]

[dependencies]
iroh = "1.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
base64 = "0.22"
getrandom = "0.3"
uniffi = { version = "0.32", optional = true }

[dev-dependencies]
qrcode = { version = "0.14", default-features = false }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

