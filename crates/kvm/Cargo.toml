[package]
name = "atic-kvm"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Un mouse y un teclado para dos computadores: el cursor pasa al otro por el borde (iroh)."

[[bin]]
name = "atic-kvm"
path = "src/bin/atic-kvm.rs"

[dependencies]
atic-core = { path = "../core" }
atic-clipboard = { path = "../clipboard" }
arboard = "3"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
iroh = "1.3"
# Encontrar los otros equipos de la red sin internet (mDNS).
iroh-mdns-address-lookup = "0.6"
n0-future = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
getrandom = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
# Leer el portapapeles de arrastre (qué archivos se arrastran al borde).
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
# La ventana del borde que recibe lo que se arrastra (`IDropTarget`, COM).
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_UI_Shell",
] }
windows-core = "0.61"
