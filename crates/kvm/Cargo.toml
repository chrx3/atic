[package]
name = "atic-kvm"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Un mouse y un teclado para dos computadores: el cursor pasa al otro por el borde (iroh)."

[[bin]]
name = "atic-kvm"
path = "src/bin/atic-kvm.rs"

[dependencies]
atic-core = { path = "../core" }
iroh = "1.3"
# Encontrar los otros equipos de la red sin internet (mDNS).
iroh-mdns-address-lookup = "0.6"
n0-future = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
getrandom = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
